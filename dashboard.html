<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard | Patel Holdings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f5f5f5;
      color: #303741;
    }

    header {
      background-color: #13274f;
      color: white;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout-btn {
      background-color: #e2b957;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      color: #13274f;
    }

    .logout-btn:hover {
      background-color: #f3d8a0;
    }

    h2 {
      margin: 2rem 0 1rem 2rem;
      font-size: 1.5rem;
    }

    .section {
      background: white;
      margin: 1rem 2rem;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBKk0b2-Dr2IkiiSObJdxdKiNaHRCQMmzo",
      authDomain: "patel-holdings.firebaseapp.com",
      projectId: "patel-holdings",
      storageBucket: "patel-holdings.firebasestorage.app",
      messagingSenderId: "703106012824",
      appId: "1:703106012824:web:9a51ca849e006fa41fa2ed",
      measurementId: "G-N3KFG5C1ZL"
    };

    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        document.getElementById("welcomeUser").innerText = `Welcome, ${user.email}`;
      } else {
        window.location.href = "family-portal.html";
      }
    });

    function logout() {
      firebase.auth().signOut().then(() => {
        window.location.href = "family-portal.html";
      });
    }
  </script>
</head>
<body>
  <header>
    <div id="welcomeUser">Welcome</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <h2>Dashboard</h2>

  <div class="section">
    <h3>Fund Performance</h3>
    <p>Chart and data for Core and Kids Funds. (Coming soon)</p>
  </div>

  <div class="section">
    <h3>Current Holdings</h3>
    <p>List of current portfolio allocations and assets. (Coming soon)</p>
  </div>

  <div class="section">
    <h3>Your Equity</h3>
    <p>Ownership breakdown and investment share. (Coming soon)</p>
  </div>
</body>
</html>
