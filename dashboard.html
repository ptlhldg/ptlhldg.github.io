
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patel Holdings Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f5f5f5;
      color: #13274f;
    }

    header {
      background-color: #13274f;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
    }

    .logo h1 {
      font-family: 'Merriweather', serif;
      font-size: 1.5rem;
    }

    .logout-btn {
      background-color: #e2b957;
      color: #0f2442;
      border: none;
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background-color: #f3d8a0;
    }

    main {
      padding: 2rem;
    }

    h2 {
      font-family: 'Merriweather', serif;
      margin-bottom: 1rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="favicon.JPG" alt="Patel Holdings Logo" />
      <h1>Welcome, <span id="userName">User</span></h1>
    </div>
    <button class="logout-btn" id="logoutBtn">Log Out</button>
  </header>

  <main>
    <h2>Dashboard</h2>
    <div class="card-grid">
      <a href="fund-performance.html" class="card">
        <h3>Fund Performance</h3>
        <p>View interactive performance charts</p>
      </a>
      <a href="equity.html" class="card">
        <h3>Your Equity</h3>
        <p>Coming soon...</p>
      </a>
      <a href="current-holdings.html" class="card">
        <h3>Current Holdings</h3>
        <p>View live AUM numbers, and breakdown per division</p>
      </a>
    </div>
  </main>

  <!-- Firebase App (Core SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <!-- Firebase Authentication -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBKk0b2-Dr2IkiiSObJdxdKiNaHRCQMmzo",
      authDomain: "patel-holdings.firebaseapp.com",
      projectId: "patel-holdings",
      storageBucket: "patel-holdings.firebasestorage.app",
      messagingSenderId: "703106012824",
      appId: "1:703106012824:web:9a51ca849e006fa41fa2ed",
      measurementId: "G-N3KFG5C1ZL"
    };

    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged(function(user) {
      if (user) {
        document.getElementById("userName").textContent = user.email;
      } else {
        window.location.href = "family-portal.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", function() {
      firebase.auth().signOut().then(() => {
        window.location.href = "family-portal.html";
      });
    });
  </script>
</body>
</html>
