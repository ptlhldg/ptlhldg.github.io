<html lang="en">
<head>

  <style>
    :root {
      --navy-deepest: #070e1c;
      --navy-deep:    #0d1b2e;
      --navy-mid:     #13274f;
      --gold:         #e2b957;
      --gold-muted:   #c9a23e;
      --cream:        #ede8e0;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy-deepest);
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    body.ready { opacity: 1; }
    a { text-decoration: none; color: inherit; }
    ::selection { background: rgba(226,185,87,0.25); color: var(--cream); }

    /* ── BACKGROUND ── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 15%, rgba(19,39,79,0.9) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 90% 80%, rgba(13,27,46,0.95) 0%, transparent 65%),
        linear-gradient(135deg, #070e1c 0%, #0d1b2e 50%, #070e1c 100%);
      animation: bgShift 20s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0%   { filter: brightness(1); }
      100% { filter: brightness(1.04) hue-rotate(3deg); }
    }
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(90px); pointer-events: none; z-index: 0;
      will-change: transform;
    }
    .orb-1 { width: 500px; height: 500px; background: var(--gold);  opacity: 0.08; top: -150px; right: -100px; animation: orbDrift 24s ease-in-out infinite alternate; }
    .orb-2 { width: 350px; height: 350px; background: #2244aa;       opacity: 0.10; bottom: 50px; left: -80px;   animation: orbDrift 19s ease-in-out infinite alternate-reverse; }
    @keyframes orbDrift { from { transform: translate(0,0); } to { transform: translate(28px, 20px); } }
    .grain {
      position: fixed; inset: 0; z-index: 1; opacity: 0.02; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── TOP NAV ── */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px; padding: 0 2.5rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(7,14,28,0.7);
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .topnav-left { display: flex; align-items: center; gap: 0.85rem; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, rgba(226,185,87,0.16), rgba(19,39,79,0.6));
      border: 1px solid rgba(226,185,87,0.32);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem; font-style: italic;
      color: var(--gold); flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(226,185,87,0.25);
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--cream);
    }
    .nav-sep { color: rgba(237,232,224,0.2); font-size: 0.9rem; margin: 0 0.1rem; }
    .nav-page { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(237,232,224,0.35); }
    .topnav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-back {
      display: flex; align-items: center; gap: 0.45rem;
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(237,232,224,0.4); transition: color 0.25s ease;
    }
    .nav-back:hover { color: var(--cream); }
    .nav-back svg { transition: transform 0.25s ease; }
    .nav-back:hover svg { transform: translateX(-3px); }
    .logout-btn {
      display: flex; align-items: center; gap: 0.4rem;
      background: rgba(224,92,122,0.1); border: 1px solid rgba(224,92,122,0.2);
      color: rgba(224,92,122,0.75); padding: 0.38rem 0.85rem; border-radius: 40px;
      font-size: 0.72rem; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: all 0.25s ease;
    }
    .logout-btn:hover { background: rgba(224,92,122,0.18); border-color: rgba(224,92,122,0.4); color: #f09090; }

    /* ── MAIN ── */
    main {
      position: relative; z-index: 2;
      padding: 5.5rem 2.5rem 5rem;
      max-width: 1280px; margin: 0 auto;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 3rem 0 3.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 3.5rem;
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; gap: 1.5rem;
    }
    .page-eyebrow {
      font-size: 0.68rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 0.75rem;
      opacity: 0; animation: fadeUp 0.6s ease forwards 0.1s;
    }
    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 300; color: var(--cream); line-height: 1.12;
      opacity: 0; animation: fadeUp 0.6s ease forwards 0.25s;
    }
    .page-title em { font-style: italic; color: rgba(237,232,224,0.45); }
    .page-subtitle {
      font-size: 0.88rem; font-weight: 300;
      color: rgba(237,232,224,0.4); margin-top: 0.75rem;
      opacity: 0; animation: fadeUp 0.6s ease forwards 0.4s;
    }
    .total-aum-badge {
      opacity: 0; animation: fadeUp 0.6s ease forwards 0.5s;
      background: rgba(226,185,87,0.08);
      border: 1px solid rgba(226,185,87,0.2);
      border-radius: 14px; padding: 1.25rem 1.75rem;
      text-align: right; flex-shrink: 0;
    }
    .aum-label { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(226,185,87,0.6); margin-bottom: 0.4rem; }
    .aum-value { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 300; color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums; }

    /* ── SUMMARY ── */
    .summary-section { margin-bottom: 3.5rem; opacity: 0; animation: fadeUp 0.7s ease forwards 0.55s; }
    .section-label {
      font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1.25rem;
    }
    .summary-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; align-items: stretch; }
    .summary-table-wrap {
      background: rgba(255,255,255,0.025);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.07);
    }
    .summary-table { width: 100%; border-collapse: collapse; }
    .summary-table th {
      font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(237,232,224,0.3); font-weight: 400;
      text-align: left; padding: 1rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
    }
    .summary-table th:nth-child(2), .summary-table th:nth-child(3) { text-align: right; }
    .summary-table td { padding: 1rem 1.5rem; font-size: 0.86rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .summary-table tbody tr { cursor: pointer; transition: background 0.2s ease; }
    .summary-table tbody tr:hover { background: rgba(255,255,255,0.03); }
    .summary-table tbody tr.total-row { cursor: default; background: rgba(226,185,87,0.04); }
    .summary-table tbody tr.total-row:hover { background: rgba(226,185,87,0.05); }
    .summary-table tbody tr:last-child td { border-bottom: none; }
    .td-name { display: flex; align-items: center; gap: 0.6rem; color: rgba(237,232,224,0.75); font-weight: 300; }
    .td-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .td-aum { text-align: right; font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; color: var(--cream); font-variant-numeric: tabular-nums; }
    .td-alloc { text-align: right; font-size: 0.78rem; color: rgba(237,232,224,0.4); font-variant-numeric: tabular-nums; }
    .td-bar { width: 120px; }
    .mini-bar-bg { height: 3px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .mini-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-muted)); width: 0; transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
    .total-label { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--gold); }
    .total-aum-cell { text-align: right; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: var(--gold); font-variant-numeric: tabular-nums; }

    /* Donut */
    .donut-panel {
      background: rgba(255,255,255,0.025);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.07);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 1.75rem; gap: 1.25rem;
    }
    .donut-wrap { position: relative; width: 168px; height: 168px; }
    .donut {
      width: 100%; height: 100%; border-radius: 50%;
      background: conic-gradient(
        #e2b957 0deg 92.41deg,
        #5ce0a0 92.41deg 180.18deg,
        #5c9ee0 180.18deg 243.40deg,
        #c05ce0 243.40deg 301.75deg,
        #e07a5c 301.75deg 360deg
      );
      -webkit-mask: radial-gradient(circle, transparent 58%, #000 59%);
              mask: radial-gradient(circle, transparent 58%, #000 59%);
      animation: donutSpin 1.4s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center;
    }
    @keyframes donutSpin { from { transform: rotate(-90deg) scale(0.85); opacity: 0; } to { transform: rotate(0deg) scale(1); opacity: 1; } }
    .donut-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .donut-center-val { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 300; color: var(--cream); line-height: 1; }
    .donut-center-lbl { font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(237,232,224,0.35); margin-top: 0.35rem; }
    .donut-legend { display: flex; flex-direction: column; gap: 0.45rem; width: 100%; }
    .dl-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.7rem; color: rgba(237,232,224,0.5); }
    .dl-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dl-pct { margin-left: auto; color: rgba(237,232,224,0.3); font-variant-numeric: tabular-nums; }

    /* ── TABS ── */
    .tabs-section { opacity: 0; animation: fadeUp 0.7s ease forwards 0.7s; }
    .tab-bar {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .tab-btn {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(237,232,224,0.5);
      padding: 0.6rem 1.25rem; border-radius: 40px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem; font-weight: 400;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: all 0.25s ease;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.06); color: rgba(237,232,224,0.8); }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(226,185,87,0.16), rgba(226,185,87,0.07));
      border-color: rgba(226,185,87,0.35); color: var(--gold);
      box-shadow: 0 0 18px rgba(226,185,87,0.12);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: panelIn 0.4s ease; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .panel-card {
      background: rgba(255,255,255,0.025);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 2rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.07);
    }
    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 400; color: var(--cream);
    }
    .panel-subtitle {
      font-size: 0.78rem; color: rgba(226,185,87,0.6);
      margin: 0.35rem 0 1.75rem; letter-spacing: 0.04em;
      padding-bottom: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .panel-prose p { font-size: 0.88rem; font-weight: 300; color: rgba(237,232,224,0.55); line-height: 1.8; margin-bottom: 1.1rem; }
    .panel-prose h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; font-weight: 400; color: var(--cream);
      margin: 1.75rem 0 0.5rem;
    }

    .fund-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .fund-bucket {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 1.5rem;
    }
    .bucket-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 1.25rem; padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .bucket-name { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(237,232,224,0.45); }
    .bucket-pct { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; color: var(--gold); }

    .holding-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 0.55rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .holding-row:last-child { border-bottom: none; }
    .holding-left { display: flex; align-items: baseline; gap: 0.65rem; min-width: 0; }
    .holding-ticker { font-size: 0.85rem; font-weight: 500; color: rgba(237,232,224,0.8); letter-spacing: 0.04em; }
    .holding-category { font-size: 0.68rem; color: rgba(237,232,224,0.3); white-space: nowrap; }
    .holding-pct-wrap { display: flex; align-items: center; gap: 0.65rem; flex-shrink: 0; }
    .h-bar-bg { width: 64px; height: 3px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .h-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-muted)); }
    .holding-pct { font-size: 0.78rem; color: rgba(237,232,224,0.5); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; transition-duration: 0.001s !important; }
      .mini-bar-fill { transition: none; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .summary-grid { grid-template-columns: 1fr; }
      .fund-grid { grid-template-columns: 1fr; }
      .td-bar { display: none; }
      .summary-table th:nth-child(4) { display: none; }
    }
    @media (max-width: 640px) {
      main { padding: 5rem 1.25rem 3rem; }
      .topnav { padding: 0 1.25rem; }
      .brand-name, .nav-sep, .nav-page { display: none; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .summary-table td, .summary-table th { padding: 0.8rem 0.9rem; }
      .panel-card { padding: 1.5rem; }
    }
  </style>
</head>

  <main>

  </main>

  <script>

      summaryBody.appendChild(tr);
    });
    const totalTr = document.createElement('tr');
    totalTr.className = 'total-row';
    totalTr.innerHTML = `
      <td><span class="total-label">Patel Holdings LLC</span></td>

    /* ── Render tabs + panels ── */
    const tabBar = document.getElementById('tabBar');
    const tabPanels = document.getElementById('tabPanels');

    PILLARS.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
      btn.dataset.tab = p.id;
      btn.setAttribute('role', 'tab');
      btn.textContent = p.tab;
      btn.addEventListener('click', () => switchTab(p.id));
      tabBar.appendChild(btn);

      const panel = document.createElement('div');
      panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
      panel.id = `tab-${p.id}`;
      panel.setAttribute('role', 'tabpanel');

      let inner = `
        <div class="panel-card">
          <div class="panel-title">${p.name}</div>
          <div class="panel-subtitle">${p.aumFmt} · ${p.allocFmt} of total portfolio</div>`;
      if (p.type === 'fund') {
        inner += `<div class="fund-grid">` + p.buckets.map(b => `
          <div class="fund-bucket">
            <div class="bucket-header">

              <div class="bucket-pct">${b.pct}</div>

      }
      inner += `</div>`;
      panel.innerHTML = inner;
      tabPanels.appendChild(panel);
    });

    /* ── Tab switching ── */
    function switchTab(id) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${id}`));
      document.querySelector('.tabs-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Init ── */
    document.body.classList.add('ready');
    setTimeout(() => {
      document.querySelectorAll('.mini-bar-fill').forEach(el => { el.style.width = el.dataset.w + '%'; });
    }, 350);

    // ── Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {

    });

    // ── Orb parallax
    if (window.innerWidth > 900) {
      document.addEventListener('mousemove', e => {
        const x = (e.clientX / window.innerWidth  - 0.5) * 16;
        const y = (e.clientY / window.innerHeight - 0.5) * 16;
        document.querySelector('.orb-1').style.transform = `translate(${x * 0.6}px,${y * 0.6}px)`;
        document.querySelector('.orb-2').style.transform = `translate(${-x * 0.4}px,${-y * 0.4}px)`;
      });
    }
