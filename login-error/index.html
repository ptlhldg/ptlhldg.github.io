<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied — Patel Holdings</title>
  <link rel="icon" type="image/jpeg" href="/favicon.JPG" />
  <meta name="robots" content="noindex, nofollow" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N3KFG5C1ZL"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N3KFG5C1ZL');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--navy-deepest:#070e1c;--gold:#e2b957;--gold-muted:#c9a23e;--cream:#ede8e0;--red:#e05c7a;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--navy-deepest);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center;padding:2rem;}
    a{text-decoration:none;color:inherit;}
    .bg-canvas{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 30%,rgba(19,39,79,0.9) 0%,transparent 65%),radial-gradient(ellipse 60% 70% at 80% 70%,rgba(13,27,46,0.95) 0%,transparent 60%),linear-gradient(145deg,#070e1c 0%,#0a1525 50%,#070e1c 100%);animation:bgShift 18s ease-in-out infinite alternate;}
    @keyframes bgShift{0%{filter:brightness(1);}100%{filter:brightness(1.04) hue-rotate(4deg);}}
    .orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}
    .orb-1{width:500px;height:500px;background:var(--red);opacity:0.06;top:-180px;right:-130px;animation:orbDrift 22s ease-in-out infinite alternate;}
    .orb-2{width:380px;height:380px;background:#2244aa;opacity:0.08;bottom:-80px;left:-100px;animation:orbDrift 17s ease-in-out infinite alternate-reverse;}
    @keyframes orbDrift{from{transform:translate(0,0);}to{transform:translate(25px,18px);}}
    .grain{position:fixed;inset:0;z-index:1;opacity:0.02;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
    .content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
    .brand{display:flex;align-items:center;gap:0.7rem;margin-bottom:3rem;opacity:0;animation:fadeUp 0.6s ease forwards 0.1s;}
    .brand-mark{width:32px;height:32px;border-radius:8px;object-fit:cover;box-shadow:0 2px 14px rgba(226,185,87,0.45),0 0 0 1px rgba(226,185,87,0.18);}
    .brand-name{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(237,232,224,0.55);}
    .error-card{background:rgba(255,255,255,0.025);backdrop-filter:blur(24px);border:1px solid rgba(224,92,122,0.18);border-radius:20px;padding:3rem 2.5rem;max-width:420px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,0.4),0 0 0 1px rgba(224,92,122,0.08),inset 0 1px 0 rgba(255,255,255,0.07);opacity:0;animation:fadeUp 0.7s ease forwards 0.25s;}
    .error-icon{width:64px;height:64px;border-radius:18px;margin:0 auto 1.75rem;background:linear-gradient(135deg,rgba(224,92,122,0.15),rgba(224,92,122,0.05));border:1px solid rgba(224,92,122,0.25);display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px rgba(224,92,122,0.12);}
    .error-title{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:300;color:var(--cream);margin-bottom:0.75rem;line-height:1.2;}
    .error-title em{font-style:italic;color:rgba(237,232,224,0.4);}
    .error-body{font-size:0.88rem;font-weight:300;color:rgba(237,232,224,0.45);line-height:1.8;margin-bottom:2rem;}
    .gold-rule{width:40px;height:1px;margin:0 auto 2rem;background:linear-gradient(90deg,transparent,rgba(224,92,122,0.4),transparent);}
    .btn-group{display:flex;flex-direction:column;gap:0.75rem;}
    .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-muted));color:var(--navy-deepest);padding:0.85rem 2rem;border-radius:50px;font-size:0.78rem;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:0.5rem;transition:all 0.3s ease;box-shadow:0 4px 20px rgba(226,185,87,0.28);}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(226,185,87,0.42);}
    .btn-ghost{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);color:rgba(237,232,224,0.6);padding:0.85rem 2rem;border-radius:50px;font-size:0.78rem;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:0.5rem;transition:all 0.3s ease;backdrop-filter:blur(10px);}
    .btn-ghost:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.22);transform:translateY(-2px);}
    .security-badge{display:flex;align-items:center;justify-content:center;gap:0.45rem;font-size:0.68rem;letter-spacing:0.1em;color:rgba(237,232,224,0.2);margin-top:2rem;opacity:0;animation:fadeUp 0.6s ease forwards 0.55s;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:480px){.error-card{padding:2rem 1.5rem;}}
  </style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="grain"></div>
  <div class="content">
    <a href="/" class="brand">
      <img src="/favicon.JPG" alt="Patel Holdings" class="brand-mark" />
      <span class="brand-name">Patel Holdings</span>
    </a>
    <div class="error-card">
      <div class="error-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(224,92,122,0.9)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <h1 class="error-title">Login <em>Failed</em></h1>
      <div class="gold-rule"></div>
      <p class="error-body">We were unable to verify your identity.<br>Please try again or contact IT support<br>if the issue persists.</p>
      <div class="btn-group">
        <a href="/family-portal" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
          Try Again
        </a>
        <a href="/contact" class="btn-ghost">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Contact IT Support
        </a>
        <a href="/" class="btn-ghost" style="border-color:rgba(255,255,255,0.07);color:rgba(237,232,224,0.35);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Return to Homepage
        </a>
      </div>
    </div>
    <div class="security-badge">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Zero Trust · Cloudflare Access · All attempts logged
    </div>
  </div>
  <script>
    document.addEventListener('mousemove', e => {
      const x = (e.clientX / window.innerWidth  - 0.5) * 14;
      const y = (e.clientY / window.innerHeight - 0.5) * 14;
      document.querySelector('.orb-1').style.transform = `translate(${x*0.6}px,${y*0.6}px)`;
      document.querySelector('.orb-2').style.transform = `translate(${-x*0.4}px,${-y*0.4}px)`;
    });
  </script>
</body>
</html>
