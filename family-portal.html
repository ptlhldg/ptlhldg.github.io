<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Portal Login | Patel Holdings</title>
  <link rel="icon" type="image/jpeg" href="favicon.JPG" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Firebase App (Core SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <!-- Firebase Authentication -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBKk0b2-Dr2IkiiSObJdxdKiNaHRCQMmzo",
      authDomain: "patel-holdings.firebaseapp.com",
      projectId: "patel-holdings",
      storageBucket: "patel-holdings.firebasestorage.app",
      messagingSenderId: "703106012824",
      appId: "1:703106012824:web:9a51ca849e006fa41fa2ed",
      measurementId: "G-N3KFG5C1ZL"
    };

    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    :root {
      --primary-dark: #0f2442;
      --primary: #13274f;
      --primary-light: #2a4270;
      --secondary: #e2b957;
      --secondary-light: #f3d8a0;
      --neutral-dark: #303741;
      --neutral-light: #f5f5f5;
      --font-heading: 'Merriweather', serif;
      --font-body: 'Inter', sans-serif;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--neutral-light);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      background-color: white;
      padding: 2.5rem;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .login-box h2 {
      font-family: var(--font-heading);
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .login-box p {
      color: var(--neutral-dark);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--primary);
      font-weight: 500;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      transition: var(--transition);
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(19, 39, 79, 0.1);
    }

    .submit-btn {
      background-color: var(--secondary);
      color: var(--primary-dark);
      padding: 0.75rem 2rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: var(--transition);
      width: 100%;
    }

    .submit-btn:hover {
      background-color: var(--secondary-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
    }

    .note {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="favicon.JPG" alt="Patel Holdings Logo" style="width: 70px; height: 70px; margin-bottom: 1rem; border-radius: 8px;" />
    <h2>Family Portal</h2>
    <p>Secure access for Patel family members and authorized users</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="submit-btn">Sign In</button>
    </form>
    <p class="note">Need access? Contact Patel Holdings administrator.</p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          window.location.href = "fund-performance.html";
        })
        .catch((error) => {
          alert("Login failed: " + error.message);
        });
    });
  </script>
</body>
</html>
