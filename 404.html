<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Patel Holdings</title>
  <link rel="icon" type="image/jpeg" href="/favicon.JPG" />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy-deepest: #070e1c;
      --navy-deep:    #0d1b2e;
      --gold:         #e2b957;
      --gold-muted:   #c9a23e;
      --cream:        #ede8e0;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy-deepest);
      color: var(--cream);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
      text-align: center;
      padding: 2rem;
    }
    a { text-decoration: none; color: inherit; }

    /* ── BACKGROUND ── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(19,39,79,0.9) 0%, transparent 65%),
        radial-gradient(ellipse 60% 70% at 80% 70%, rgba(13,27,46,0.95) 0%, transparent 60%),
        linear-gradient(145deg, #070e1c 0%, #0a1525 50%, #070e1c 100%);
      animation: bgShift 18s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0%   { filter: brightness(1); }
      100% { filter: brightness(1.04) hue-rotate(4deg); }
    }
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(100px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 550px; height: 550px; background: var(--gold);  opacity: 0.07; top: -180px; right: -130px; animation: orbDrift 22s ease-in-out infinite alternate; }
    .orb-2 { width: 380px; height: 380px; background: #2244aa;       opacity: 0.09; bottom: -80px; left: -100px; animation: orbDrift 17s ease-in-out infinite alternate-reverse; }
    @keyframes orbDrift { from { transform:translate(0,0); } to { transform:translate(25px,18px); } }
    .grain {
      position: fixed; inset: 0; z-index: 1; opacity: 0.02; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── CONTENT ── */
    .content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
    }

    /* Brand */
    .brand {
      display: flex; align-items: center; gap: 0.7rem;
      margin-bottom: 3.5rem;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.1s;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--gold), var(--gold-muted));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem; font-weight: 600; color: var(--navy-deepest);
      box-shadow: 0 2px 14px rgba(226,185,87,0.4);
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase; color: rgba(237,232,224,0.55);
    }

    /* 404 number */
    .error-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(7rem, 20vw, 14rem);
      font-weight: 300; line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(237,232,224,0.12);
      letter-spacing: -0.02em;
      margin-bottom: -1rem;
      opacity: 0; animation: fadeUp 0.8s ease forwards 0.2s;
      user-select: none;
    }

    .gold-rule {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 2rem auto;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.5s;
    }

    .error-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 300; color: var(--cream); line-height: 1.2;
      margin-bottom: 1rem;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.55s;
    }
    .error-title em { font-style: italic; color: rgba(237,232,224,0.45); }

    .error-body {
      font-size: 0.9rem; font-weight: 300;
      color: rgba(237,232,224,0.45); line-height: 1.8;
      max-width: 420px; margin-bottom: 2.5rem;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.7s;
    }

    /* CTA group */
    .cta-group {
      display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.85s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-muted));
      color: var(--navy-deepest); padding: 0.8rem 2rem; border-radius: 50px;
      font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      border: none; cursor: pointer; display: inline-block;
      transition: all 0.3s ease;
      box-shadow: 0 4px 22px rgba(226,185,87,0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(226,185,87,0.45); }
    .btn-ghost {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--cream); padding: 0.8rem 2rem; border-radius: 50px;
      font-size: 0.78rem; font-weight: 400;
      letter-spacing: 0.12em; text-transform: uppercase;
      display: inline-block; transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.28); transform: translateY(-2px); }

    /* Quick links */
    .quick-links {
      display: flex; gap: 2rem; margin-top: 3rem;
      opacity: 0; animation: fadeUp 0.7s ease forwards 1s;
    }
    .quick-link {
      font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(237,232,224,0.28); transition: color 0.25s ease;
      position: relative; padding-bottom: 2px;
    }
    .quick-link::after {
      content: ''; position: absolute; bottom: 0; left: 0;
      width: 0; height: 1px; background: var(--gold);
      transition: width 0.3s ease;
    }
    .quick-link:hover { color: rgba(237,232,224,0.65); }
    .quick-link:hover::after { width: 100%; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .quick-links { flex-wrap: wrap; justify-content: center; gap: 1.25rem; }
    }
  </style>
</head>
<body>

  <div class="bg-canvas"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="grain"></div>

  <div class="content">

    <a href="/" class="brand">
      <div class="brand-mark">PH</div>
      <span class="brand-name">Patel Holdings</span>
    </a>

    <div class="error-number">404</div>

    <div class="gold-rule"></div>

    <h1 class="error-title">Page <em>Not Found</em></h1>

    <p class="error-body">
      The page you're looking for doesn't exist or may have been moved.
      Even the best investors occasionally look in the wrong places.
    </p>

    <div class="cta-group">
      <a href="/" class="btn-primary">Return Home</a>
      <a href="/contact" class="btn-ghost">Contact Us</a>
    </div>

    <div class="quick-links">
      <a href="/" class="quick-link">Home</a>
      <a href="/contact" class="quick-link">Contact</a>
      <a href="/family-portal" class="quick-link">Family Portal</a>
    </div>

  </div>

  <script>
    // Subtle orb parallax
    document.addEventListener('mousemove', e => {
      const x = (e.clientX / window.innerWidth  - 0.5) * 14;
      const y = (e.clientY / window.innerHeight - 0.5) * 14;
      document.querySelector('.orb-1').style.transform = `translate(${x*0.6}px,${y*0.6}px)`;
      document.querySelector('.orb-2').style.transform = `translate(${-x*0.4}px,${-y*0.4}px)`;
    });
  </script>
</body>
</html>
